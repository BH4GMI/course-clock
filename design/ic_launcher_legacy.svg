<!--
  旧式启动图标（API 21~25 用，需要栅格化成 PNG mipmap）。
  深靛蓝圆角方 + 白色标记 + 琥珀色提醒点。
  标记这里占 60×60（translate 24,24 / scale 2.5），比自适应前景的 56 稍大，
  因为旧式图标没有遮罩裁剪，可以画得更满。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <path fill="#233A6B" d="M24,0h60a24,24 0 0 1 24,24v60a24,24 0 0 1 -24,24h-60a24,24 0 0 1 -24,-24v-60a24,24 0 0 1 24,-24z"/>
  <g transform="translate(24,24) scale(2.5)">
    <path fill="#FFFFFF" d="M4.75,5h8.5a1.75,1.75 0 0 1 0,3.5h-8.5a1.75,1.75 0 0 1 0,-3.5z"/>
    <path fill="#FFFFFF" d="M4.75,10.25h5.5a1.75,1.75 0 0 1 0,3.5h-5.5a1.75,1.75 0 0 1 0,-3.5z"/>
    <path fill="#FFFFFF" d="M4.75,15.5h10.5a1.75,1.75 0 0 1 0,3.5h-10.5a1.75,1.75 0 0 1 0,-3.5z"/>
    <path fill="#FFC24B" d="M16.75,6.75a2.25,2.25 0 1 1 4.5,0a2.25,2.25 0 1 1 -4.5,0z"/>
  </g>
</svg>
