<?xml version="1.0" encoding="UTF-8"?>
<!--
  日视图小部件（今日课程）· 浅色 · 4×2

  画布 700×320 = 真实尺寸的 2 倍；本机 4×2 约 353×161dp，所以这里 1 单位 ≈ 0.5dp。

  ⚠ 竖条圆角与卡片圆角「同心」的做法：
  竖条宽 8、如果各自带圆角，半径最多只能取 4（SVG/Android 都会把圆角夹到短边的一半），
  而卡片圆角是 16 —— 两个圆角不同心，卡片底色就会从接缝里透出来一条月牙形。
  所以这里不再给竖条自己圆角：用卡片轮廓做 <clipPath>，竖条画成直角矩形由 clip 裁出来，
  外边自然就是卡片的 16 圆角，内边是直角。
  Android 侧对应的是父容器 android:clipToOutline="true" + 一张圆角 shape 背景，
  子 View（底色、竖条）都不带圆角，由父容器裁 —— 同一套几何。

  数据取自设备上拉下来的真实课程库（2026-09-14 第 1 周 周二）：
    第 1-2 节 08:15  汽车电控技术      @B210多  魏丹      课程色 #FF1744
    第 6-7 节 13:20  汽车检测诊断技术  @C106多  马其华    课程色 #1DE9B6
-->
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Microsoft YaHei','Noto Sans SC',system-ui,sans-serif">

  <!-- 卡片轮廓：底色与竖条共用这一条剪裁路径 -->
  <defs>
    <clipPath id="card1">
      <rect x="0" y="0" width="644" height="92" rx="16"/>
    </clipPath>
    <clipPath id="card2">
      <rect x="0" y="0" width="644" height="92" rx="16"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="700" height="320" rx="24" fill="#FFFFFF"/>

  <!-- 表头 -->
  <text x="32" y="58" font-size="30" font-weight="700" fill="#1A1B1F">9月15日</text>
  <text x="196" y="56" font-size="22" fill="#6B7280">第1周  周二</text>
  <path d="M650 36 l12 12 -12 12" fill="none" stroke="#B6BCC6" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="28" y1="80" x2="672" y2="80" stroke="#14000000"/>

  <!-- 第 1 节课 -->
  <g transform="translate(28,96)">
    <g clip-path="url(#card1)">
      <rect x="0" y="0" width="644" height="92" fill="#FF1744" fill-opacity="0.12"/>
      <rect x="0" y="0" width="8" height="92" fill="#FF1744"/>
    </g>
    <text x="30" y="40" font-size="28" font-weight="700" fill="#1A1B1F">1</text>
    <text x="30" y="70" font-size="21" fill="#6B7280">08:15</text>
    <text x="112" y="42" font-size="30" font-weight="700" fill="#1A1B1F">汽车电控技术</text>
    <text x="112" y="74" font-size="22" fill="#6B7280">@B210多  ·  魏丹</text>
  </g>

  <!-- 第 2 节课 -->
  <g transform="translate(28,200)">
    <g clip-path="url(#card2)">
      <rect x="0" y="0" width="644" height="92" fill="#1DE9B6" fill-opacity="0.20"/>
      <rect x="0" y="0" width="8" height="92" fill="#12B48C"/>
    </g>
    <text x="30" y="40" font-size="28" font-weight="700" fill="#1A1B1F">6</text>
    <text x="30" y="70" font-size="21" fill="#6B7280">13:20</text>
    <text x="112" y="42" font-size="30" font-weight="700" fill="#1A1B1F">汽车检测诊断技术</text>
    <text x="112" y="74" font-size="22" fill="#6B7280">@C106多  ·  马其华</text>
  </g>
</svg>
