<!--
  侧边栏「设置」图标：三条滑杆。比齿轮更极简，在 24dp 下也更清楚。

  **必须单色**：侧边栏在 ScheduleActivityUI 里设了 itemIconTintList =
  createColorStateList(colorOnBackground)，图标会被整体染成一个颜色。
  所以这里不能用"横杆一色、旋钮另一色"的写法 —— 染色后两者同色，旋钮就看不出来了。
  旋钮靠**直径大于杆宽**（5.2 对 2）在单色下仍然可见，这是滑块图标的标准做法。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path fill="#233A6B" d="M4,5h16a1,1 0 0 1 0,2h-16a1,1 0 0 1 0,-2z"/>
  <path fill="#233A6B" d="M4,11h16a1,1 0 0 1 0,2h-16a1,1 0 0 1 0,-2z"/>
  <path fill="#233A6B" d="M4,17h16a1,1 0 0 1 0,2h-16a1,1 0 0 1 0,-2z"/>
  <path fill="#233A6B" d="M5.4,6a2.6,2.6 0 1 1 5.2,0a2.6,2.6 0 1 1 -5.2,0z"/>
  <path fill="#233A6B" d="M13.4,12a2.6,2.6 0 1 1 5.2,0a2.6,2.6 0 1 1 -5.2,0z"/>
  <path fill="#233A6B" d="M7.4,18a2.6,2.6 0 1 1 5.2,0a2.6,2.6 0 1 1 -5.2,0z"/>
</svg>
