  <path fill="#233A6B" d="M4.75,10.25h5.5a1.75,1.75 0 0 1 0,3.5h-5.5a1.75,1.75 0 0 1 0,-3.5z"/>
  <path fill="#233A6B" d="M4.75,15.5h10.5a1.75,1.75 0 0 1 0,3.5h-10.5a1.75,1.75 0 0 1 0,-3.5z"/>
  <path fill="#4C7DF0" d="M16.75,6.75a2.25,2.25 0 1 1 4.5,0a2.25,2.25 0 1 1 -4.5,0z"/>
</svg>
