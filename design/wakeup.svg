<!--
  应用标记：三条长度递减的圆角横条 = 课表行；右上角的圆点 = 提醒。
  这是全部图标与启动页 logo 的唯一造型来源。
  坐标全部用 <path> 表达（不用 <rect>/<circle>），因为 Android 的 VectorDrawable
  只支持 <path>，这样 SVG → VectorDrawable 是 1:1 的机械转换。
-->
