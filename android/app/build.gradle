apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-parcelize'

apply plugin: 'kotlin-kapt'

apply plugin: "androidx.navigation.safeargs.kotlin"

// splitties 等传递依赖的注解类在 kapt stub 阶段不可见，需要错误类型替换
kapt {
    correctErrorTypes = true
    // 导出 Room schema 到版本库：DB 已到 version 9 而从无 schema 留档，未来"是否继续
    // destructive migration"需要这份判断依据（个人 fork 不做跨版本迁移，但历史要留）。
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

// referenced in some portable lib. use android internal instead
configurations.all {
    exclude group: 'commons-logging'
}

// ---- 发布签名 ----------------------------------------------------------------
// 三样东西刻意分开存放：
//   storeFile / keyAlias 不是机密，放根目录 keystore.properties（已 gitignore），
//     免得把本机绝对路径写进仓库；
//   口令是机密，只从环境变量或输入框来，绝不落盘，也绝不进版本库。
// 旧版把 keystore 口令硬编码在这个文件里，那等于把签名密钥交给每一个拿到仓库的人。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStorePath = keystoreProperties.getProperty('storeFile') ?: System.getenv('WAKEUP_KEYSTORE')
def releaseKeyAlias = keystoreProperties.getProperty('keyAlias') ?: System.getenv('WAKEUP_KEY_ALIAS')
def releasePassword = System.getenv('WAKEUP_KEY_PASSWORD')

// 只有本次确实要「产出安装包」时才去要口令。不能用 name.contains('release') 这种粗匹配，
// 否则 :app:compileReleaseKotlin、:app:minifyReleaseWithR8 这类纯编译任务也会来要口令。
def requestedTaskNames = gradle.startParameter.taskNames
def releaseBuildRequested = requestedTaskNames.any { name ->
    def n = name.toLowerCase()
    n == 'build' || n.endsWith(':build') ||
            n == 'assemble' || n.endsWith(':assemble') ||
            n.contains('assemblerelease') || n.contains('bundlerelease') ||
            n.contains('installrelease') || n.contains('packagerelease') ||
            n.contains('signrelease')
}

if (releaseBuildRequested && !releaseStorePath) {
    throw new GradleException(
            "缺少发布签名配置。请创建 ${keystorePropertiesFile}，至少写入两行：\n" +
                    "  storeFile=/绝对路径/你的.keystore\n" +
                    "  keyAlias=你的密钥别名\n" +
                    "或改用环境变量 WAKEUP_KEYSTORE / WAKEUP_KEY_ALIAS / WAKEUP_KEY_PASSWORD。")
}
if (releaseBuildRequested && releasePassword == null) {
    releasePassword = askKeystorePassword(releaseStorePath)
}
if (releaseBuildRequested && !releaseKeyAlias && releasePassword != null) {
    releaseKeyAlias = discoverKeyAlias(releaseStorePath, releasePassword)
}

/** 弹一个口令输入框。只在真的要签发布包、且环境里没有口令时调用。 */
def askKeystorePassword(String storePath) {
    if (java.awt.GraphicsEnvironment.isHeadless()) {
        // 实测 Gradle 守护进程以 headless 启动，Swing 弹框弹不出来。这里给出可执行的指引，
        // 而不是静默地产出一个未签名的包冒充发布包。
        throw new GradleException("无法弹出口令输入框：Gradle 守护进程没有图形界面。\n" +
                "请先设置环境变量 WAKEUP_KEY_PASSWORD，再运行 gradlew assembleRelease。")
    }
    def password = new String[1]
    def cancelled = new boolean[1]
    javax.swing.SwingUtilities.invokeAndWait {
        def field = new javax.swing.JPasswordField(24)
        def panel = new javax.swing.JPanel(new java.awt.BorderLayout(0, 8))
        panel.add(new javax.swing.JLabel(
                "<html>要签名的密钥库：<br><code>${storePath}</code><br><br>请输入密钥库口令：</html>"),
                java.awt.BorderLayout.NORTH)
        panel.add(field, java.awt.BorderLayout.CENTER)
        def choice = javax.swing.JOptionPane.showConfirmDialog(null, panel,
                "WakeUp课程表 · 发布签名口令",
                javax.swing.JOptionPane.OK_CANCEL_OPTION,
                javax.swing.JOptionPane.PLAIN_MESSAGE)
        cancelled[0] = (choice != javax.swing.JOptionPane.OK_OPTION)
        password[0] = new String(field.password)
    }
    if (cancelled[0] || password[0].isEmpty()) {
        throw new GradleException("没有提供签名口令，发布构建已取消（未生成任何产物）。")
    }
    return password[0]
}

/** 从密钥库里读出唯一私钥条目的别名；多个条目时要求人工在 keystore.properties 里写明。 */
def discoverKeyAlias(String storePath, String password) {
    def keytool = new File(System.getProperty('java.home'), 'bin/keytool').absolutePath
    // 强制英文输出：keytool 会把条目类型名本地化，本地化后就解析不出别名了。
    def builder = new ProcessBuilder(keytool, '-J-Duser.language=en', '-J-Duser.country=US',
            '-list', '-keystore', storePath, '-storepass:env', 'WAKEUP_KT_PW')
    builder.environment().put('WAKEUP_KT_PW', password)
    builder.redirectErrorStream(true)
    def process = builder.start()
    def output = process.inputStream.text
    process.waitFor()
    if (process.exitValue() != 0) {
        throw new GradleException("无法读取密钥库 ${storePath}（口令是否正确？）：\n${output.trim()}")
    }
    def aliases = output.readLines()
            .findAll { it.contains('PrivateKeyEntry') }
            .collect { it.split(',')[0].trim() }
    if (aliases.isEmpty()) {
        throw new GradleException("密钥库 ${storePath} 里没有私钥条目，无法用于签名。")
    }
    if (aliases.size() > 1) {
        throw new GradleException("密钥库里有多个私钥条目：${aliases}。" +
                "请在 keystore.properties 里写明 keyAlias。")
    }
    logger.lifecycle("使用密钥库 ${storePath} 的别名：${aliases[0]}")
    return aliases[0]
}

android {
    namespace 'courseclock.timetable'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId 'courseclock.timetable'
        minSdk 21
        targetSdk 29
        // 新包名即新血统：不继承上游的 90 / 3.621，从 1 / 1.0 起算。
        versionCode 3
        versionName "1.2"
        // 依赖/单测：Robolectric 让单测拿到真的 Context / AlarmManager / NotificationManager
        // ——提醒链路里那些需要真 Context 的缺陷纯函数单测碰不到，只有真机跑才暴露。
        // 版本依据官方兼容表：4.16 支持 API 23→36；测试用 @Config(sdk = [29]) 与 targetSdk 对齐。
        // 没有配置 testInstrumentationRunner：工程没有 androidTest 源码集，instrumented 测试
        // 依赖（runner/espresso）是死配置且会拖累 lint 的类路径解析，已删除。
        vectorDrawables.useSupportLibrary = true
        // 全工程无原生代码（唯一的 .so 来源 RenderScript support 已被下方 jniLibs.excludes
        // 剔除），按 ABI 过滤只放大包体，删除。
    }
    testOptions {
        unitTests {
            // Robolectric 要用到真实资源与合并后的 manifest（它按 manifest 里的
            // android:name 创建 Application，也就是我们的 App）。
            includeAndroidResources = true
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/library_release.kotlin_module',
                         // prevent duplicate files
                         'META-INF/DEPENDENCIES.txt',
                         'META-INF/LICENSE.txt',
                         'META-INF/NOTICE.txt',
                         'META-INF/NOTICE',
                         'META-INF/LICENSE',
                         'META-INF/DEPENDENCIES',
                         'META-INF/notice.txt',
                         'META-INF/license.txt',
                         'META-INF/dependencies.txt',
                         'META-INF/LGPL2.1',
                         'META-INF/ASL2.0',
                         'org/apache/commons/codec/language/bm/*.txt']
        }
        jniLibs {
            excludes += ['lib/*/libRSSupport.so', 'lib/*/librsjni.so', 'lib/*/librsjni_androidx.so']
        }
    }
    signingConfigs {
        if (releaseStorePath && releaseKeyAlias && releasePassword) {
            release {
                storeFile file(releaseStorePath)
                keyAlias releaseKeyAlias
                storePassword releasePassword
                keyPassword releasePassword
            }
        }
    }
    buildTypes {
        simulation {
            initWith debug
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFile 'proguard-android.txt'
            proguardFile 'proguard-rules.pro'
            if (releaseStorePath && releaseKeyAlias && releasePassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        debug.java.srcDir 'src/standard/java'
        release.java.srcDir 'src/standard/java'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lint {
        // 存量问题记录在 lint-baseline.xml，新增问题挡在提交前——与"不关闭校验"的原则对齐。
        baseline = file("lint-baseline.xml")
        abortOnError true
    }
}

dependencies {
    def lifecycle_version = "2.2.0"
    def room_version = "2.6.1"

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "androidx.appcompat:appcompat:1.2.0-alpha02"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.google.android.material:material:1.2.0-alpha04'
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    // 声明版本对齐**实际解析版本**：依赖树里 1.1.3 早被 material 顶成 2.0.1
    // （见 `gradlew :app:dependencies`），写 1.1.3 只是让声明与运行时不一致、误导维护者。
    // 改成 2.0.1 不产生任何运行时变化。
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation 'com.github.GrenderG:Toasty:1.4.2'
    // Glide 已移除：课表背景图是本 App 私有目录里的本机文件（见 BackgroundStore），
    // 只需要"采样 + EXIF 旋转 + 裁剪 + 圆角 + 缓存"，由 utils/BackgroundImageLoader 承担。
    // 它为此常驻 321 个类（R8 之后仍占保留类的 5.3%）与 BitmapPool/MemoryCache/引擎线程。
    // splitties 已由上游 vendor 进 app/src/main/java/splitties/（见上游"原生View"commit），
    // 不得再引入外部 splitties 依赖，否则重复定义同名类
    implementation 'cn.carbswang.android:NumberPickerView:1.2.0'
    implementation('com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.0-beta11') {
        exclude group: 'androidx'
    }
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    testImplementation 'junit:junit:4.13'
    // Robolectric：让单测能拿到真的 Context / AlarmManager / NotificationManager。
    // 加它是因为"提醒完全没注册"那个崩溃就发生在这些需要真 Context 的路径上，
    // 纯函数单测（47 项全绿）碰不到，只有真机跑才暴露。
    // 版本依据官方兼容表：4.16 支持 API 23→36；测试用 @Config(sdk = [29]) 与 targetSdk 对齐。
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.6.1'
    // biweekly 的 jCal/JSON 支持引用 jackson-core。上游把 jackson 排除掉了，等于留下
    // 悬空引用，R8 会直接报 "Missing class com.fasterxml.jackson.core.JsonToken" 而拒绝
    // 出包。让依赖图保持完整，用不到的类由 R8 自己剪掉——实测包体没有变化。
    implementation('net.sf.biweekly:biweekly:0.6.3')
}
